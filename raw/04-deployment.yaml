apiVersion: apps/v1
kind: Deployment
metadata:
  name: histdata-app
  namespace: histdata
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: histdata-app
  template:
    metadata:
      labels:
        app: histdata-app
    spec:
      serviceAccountName: histdata-app
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: histdata-app
      containers:
        - name: histdata
          image: 000000000000.dkr.ecr.ap-south-1.amazonaws.com/histdata-app:REPLACE_TAG
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: histdata-app
            - secretRef:
                name: histdata-db
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /actuator/health/readiness, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /actuator/health/liveness, port: http}
            periodSeconds: 20

