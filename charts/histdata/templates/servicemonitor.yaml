{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "histdata.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "histdata.labels" . | nindent 4 }}
    release: {{ .Values.monitoring.release | quote }}
spec:
  selector:
    matchLabels:
      {{- include "histdata.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: {{ .Values.monitoring.port | quote }}
      path: {{ .Values.monitoring.path | quote }}
      interval: {{ .Values.monitoring.interval | quote }}
      scrapeTimeout: {{ .Values.monitoring.scrapeTimeout | quote }}
{{- end }}