{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "histdata.serviceAccountName" . }}
  labels:
    {{- include "histdata.labels" . | nindent 4 }}
  annotations:
    eks.amazonaws.com/role-arn: {{ .Values.serviceAccount.roleArn | quote }}
automountServiceAccountToken: true
{{- end }}

