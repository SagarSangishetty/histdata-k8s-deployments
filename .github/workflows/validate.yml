name: deployment-validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint charts/histdata -f environments/dev/values.yaml
      - run: mkdir -p rendered && helm template histdata charts/histdata --namespace histdata -f environments/dev/values.yaml > rendered/histdata.yaml

