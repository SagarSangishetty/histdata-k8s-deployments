name: deployment-validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Validate dev chart
        run: |
          helm lint charts/histdata -f environments/dev/values.yaml
          helm template histdata charts/histdata --namespace histdata \
            -f environments/dev/values.yaml >/dev/null
      - name: Validate prod chart
        run: |
          helm lint charts/histdata -f environments/prod/values.yaml
          helm template histdata charts/histdata --namespace histdata \
            -f environments/prod/values.yaml >/dev/null